name: One-time Rust lint repair

on:
  push:
    branches:
      - chore/github-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out setup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/github-foundation

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configure pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-

      - name: Apply narrow Rust lint repairs
        run: node .github/scripts/repair-clippy.mjs

      - name: Format and lint repairs
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features runtime-fixture -- -D warnings

      - name: Commit verified repairs
        shell: pwsh
        run: |
          git add src-tauri/src/agent_runtime/codex_actor.rs src-tauri/src/bin/product_acceptance.rs src-tauri/src/release_gate.rs src-tauri/src/tender_store/final_release.rs src-tauri/tests/manager_workspace.rs
          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Host "No Rust lint repairs were required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy Rust repository gates"
          git push origin HEAD:chore/github-foundation
