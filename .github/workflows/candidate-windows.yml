name: Windows candidate
run-name: Windows candidate ${{ inputs.candidate_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Unique identifier generated by the trusted release wizard
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build private Windows candidate
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Verify candidate source
        run: npm run verify

      - name: Read updater public key
        id: updater-public-key
        shell: pwsh
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $publicKey = [string]$config.plugins.updater.pubkey
          if ([string]::IsNullOrWhiteSpace($publicKey) -or $publicKey -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
            throw 'Tauri configuration does not contain a valid updater public key.'
          }
          "value=$publicKey" >> $env:GITHUB_OUTPUT

      - name: Build the private Windows candidate
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUANTIX_UPDATE_PUBLIC_KEY: ${{ steps.updater-public-key.outputs.value }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: quantix-v__VERSION__-candidate.${{ inputs.candidate_id }}
          releaseName: Quantix v__VERSION__ candidate ${{ inputs.candidate_id }}
          releaseBody: Private Windows x64 qualification candidate. Do not publish before the Public Release Gate authorizes this exact candidate.
          releaseDraft: true
          prerelease: true
          args: --bundles nsis,msi
