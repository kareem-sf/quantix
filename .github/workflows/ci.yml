name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: The drawing reader the service runs (qx-dwg)
        run: cargo build --release --manifest-path cad/Cargo.toml
      - run: pip install -e "./service[dev]"
      - run: ruff check service && ruff format --check service
      - name: The meaning model the tests fetch once
        uses: actions/cache@v6
        with:
          path: service/.pytest_cache/d/quantix-models
          key: multilingual-e5-small-761b726
      - run: pytest service

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: python -m venv service/.venv && service/.venv/bin/pip install -e ./service
      - run: npm ci
      - name: API types match the service
        run: npm run bindings && git diff --exit-code ui/src/api
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npx vite build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path desktop/Cargo.toml -- -D warnings
      - run: cargo clippy --manifest-path cad/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path cad/Cargo.toml
