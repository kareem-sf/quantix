name: One-time TypeScript repair

on:
  push:
    branches:
      - chore/github-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out setup branch
        uses: actions/checkout@v7
        with:
          ref: chore/github-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply narrow TypeScript repairs
        run: node .github/scripts/repair-types.mjs

      - name: Format and type-check repairs
        run: |
          npm run format
          npx tsc --noEmit

      - name: Commit verified repairs
        shell: pwsh
        run: |
          git add src/ApplicationSettings.tsx src/ManagerWorkspace.tsx src/ManagerWorkspace.test.tsx
          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Host "No TypeScript repairs were required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy TypeScript repository gates"
          git push origin HEAD:chore/github-foundation
