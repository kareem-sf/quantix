[package]
name = "quantix-cad"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reads DWG and DXF drawings for Quantix: every object with its layer, block, text and exact geometry."

[[bin]]
name = "qx-dwg"
path = "src/main.rs"

[dependencies]
# MPL-2.0. Pinned to the revisions OpenCADStudio ships, which were checked against the owner's drawings.
opencadcodec = { git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "a35f43e" }
opencadkernel = { git = "https://github.com/HakanSeven12/opencadkernel.git", rev = "ee41029", default-features = false, features = ["geom2d"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
