[project]
name = "quantix"
version = "0.1.0"
description = "Quantix tendering office service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-ai-slim[anthropic,google,openai,xai]>=2.47",
    "pypdfium2>=5.13",
    "openpyxl>=3.1.5",
    "python-docx>=1.2",
    "pillow>=12.3",
    "python-multipart>=0.0.32",
    "numpy>=2.5",
    "onnxruntime>=1.30",
    "tokenizers>=0.23",
    "markdown-it-py>=4.0",
    "fpdf2>=2.8",
    "uharfbuzz>=0.50",
    "python-pptx>=1.0",
    "rapidocr>=3.9.2",
    "python-bidi>=0.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.16",
    "pydantic-evals>=2.47",
    "coverage>=7.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantix*"]

[tool.setuptools.package-data]
"quantix.migrations" = ["script.py.mako", "versions/*.py"]
"quantix.submission" = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["quantix"]
branch = true

[tool.coverage.report]
fail_under = 0  # CI fails below this: set to what the suite reaches, so it can't quietly shrink
