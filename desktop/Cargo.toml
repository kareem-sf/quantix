[package]
name = "quantix-desktop"
version = "0.1.0"
description = "Quantix desktop window"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2"

# WebView2's own settings, which Tauri doesn't expose: the versions wry already uses
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
