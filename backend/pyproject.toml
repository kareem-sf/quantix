[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantix-service"
version = "0.1.0"
description = "Local engineer-controlled Tender Office"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-ai-slim[openai,anthropic,google]==2.40.0",
  "pydantic-monty==0.0.23",
  "openai==3.8.0",
  "anthropic==1.4.0",
  "google-genai==2.22.0",
  "httpx2==2.12.0",
  "platformdirs==4.11.7",
  "genai-prices==0.1.6",
  "mcp==2.1.1",
  "jsonschema==4.26.0",
  "Pint==0.26.1",
  "pypdfium2==5.13.0",
  "ezdxf==1.4.3",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "Pillow>=12.3,<13",
  "keyring>=25,<27",
  "filelock>=3.19,<4",
  "cryptography>=43,<51",
  "fastembed==0.8.0",
  "numpy>=2.1,<3",
  "huggingface-hub>=1,<2",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-xdist>=3.6,<4", "httpx>=0.28,<1", "ruff>=0.12,<1", "pydantic-evals==2.40.0"]
packaging = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantix*"]

[tool.setuptools.package-data]
"quantix.benchmarks" = ["fixtures/*/*.docx", "fixtures/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
