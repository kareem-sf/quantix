[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantix-service"
version = "0.1.0"
description = "Local engineer-controlled Tender Office"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2.11,<3",
  "openai-agents>=0.3,<1",
  "pypdfium2==5.13.0",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "Pillow>=12.3,<13",
  "keyring>=25,<27",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
